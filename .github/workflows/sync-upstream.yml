name: Sync IGL/Coach from upstream

# Pulls ONLY changes to igl and coach fields from upstream's teams array.
# Match is by team name. Everything else (tag, region, custom names,
# HTML/CSS/JS structure, casters list, talent list, output format) is
# left completely untouched.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/OurMeatball/VCT-Maps-and-IGL-Twitch-Commands.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Sync IGL/Coach fields
        env:
          SYNC_COMMIT_MSG_FILE: ${{ runner.temp }}/sync-commit-msg.txt
        run: node .github/scripts/sync-roster.js

      - name: Detect changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.detect.outputs.changed == 'true'
        env:
          SYNC_COMMIT_MSG_FILE: ${{ runner.temp }}/sync-commit-msg.txt
        run: |
          git add index.html
          git commit -F "$SYNC_COMMIT_MSG_FILE"
          git push origin main
